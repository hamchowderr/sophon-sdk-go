# Dependabot keeps Go module deps and GitHub Actions current, with security
# advisories opened as PRs automatically.
#
# NOTE: this repo is generated from Liqhtworks/sophon-api. Persist this file in
# the upstream publish pipeline so it survives regeneration.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
